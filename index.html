/* 3D Heading Effect */

h1, h2, h4{
    font-family: 'Poppins', sans-serif;
    color: #ff9800;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-align: center;
    transition: all 0.5s ease;

    text-shadow:
        1px 1px 0 #ffb74d,
        2px 2px 0 #ff9800,
        3px 3px 0 #fb8c00,
        4px 4px 8px rgba(0,0,0,0.5);

    animation: floatHeading 3s ease-in-out infinite;
}

/* Different Sizes */
h1{
    font-size:60px;
}

h2{
    font-size:40px;
}

h4{
    font-size:24px;
}

/* Hover Effect */
h1:hover,
h2:hover,
h4:hover{
    transform: perspective(600px) rotateX(12deg) scale(1.08);
    color:#ffd54f;
    text-shadow:
        2px 2px 0 #ff9800,
        4px 4px 0 #ff6f00,
        8px 8px 20px rgba(255,165,0,0.8);
}

/* Floating Animation */
@keyframes floatHeading{
    0%,100%{
        transform: translateY(0);
    }
    50%{
        transform: translateY(-8px);
    }
}
   nav{
    animation: slideDown 1s ease;
}

@keyframes slideDown{
    from{
        transform: translateY(-100%);
        opacity: 0;
    }
    to{
        transform: translateY(0);
        opacity: 1;
    }
}
    nav{
        width:500px;
